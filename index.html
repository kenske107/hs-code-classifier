<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --primary-brown: #a67c52;
      --dark-grey: #575d5e;
      --light-grey: #f4f4f4;
      --border: #d1d1d1;
      --text: #333333;
    }

    body {
      font-family: 'Malgun Gothic', -apple-system, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      justify-content: center;
      padding: 15px 10px;
      margin: 0;
      color: var(--text);
      -webkit-text-size-adjust: 100%;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 500px;
      padding: 30px 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
    }

    h2 {
      text-align: center;
      margin: 0 0 5px 0;
      font-size: 20px;
      font-weight: 900;
      color: var(--dark-grey);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sub-title {
      text-align: center;
      font-size: 11px;
      color: #888;
      margin-bottom: 30px;
      display: block;
    }

    .section-label {
      font-size: 12px;
      font-weight: bold;
      color: var(--primary-brown);
      margin-top: 25px;
      margin-bottom: 12px;
      display: block;
      border-bottom: 2px solid var(--primary-brown);
      width: fit-content;
      padding-bottom: 3px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .row>label {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      color: var(--dark-grey);
      margin-right: 10px;
      word-break: keep-all;
      line-height: 1.3;
    }

    input[type="number"],
    select {
      flex-basis: 140px;
      flex-shrink: 0;
      width: 140px;
      padding: 12px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
      transition: 0.3s;
      font-size: 16px;
      text-align: center;
      background-color: var(--light-grey);
      color: var(--text);
      box-sizing: border-box;
      -webkit-appearance: none;
    }

    input[type="number"]:focus,
    select:focus {
      border-color: var(--primary-brown);
      background-color: #fff;
      box-shadow: 0 0 0 2px rgba(166, 124, 82, 0.2);
    }

    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .radio-group {
      display: flex;
      gap: 6px;
      flex-basis: 140px;
      flex-shrink: 0;
      width: 140px;
      box-sizing: border-box;
    }

    .radio-group label {
      flex: 1;
      cursor: pointer;
    }

    .radio-group input {
      display: none;
    }

    .radio-group div {
      text-align: center;
      padding: 12px 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #777;
      transition: 0.2s;
      background: white;
    }

    .radio-group input:checked+div {
      background: var(--dark-grey);
      color: white;
      border-color: var(--dark-grey);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-brown);
      color: white;
      border: none;
      padding: 18px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 35px;
      letter-spacing: 1px;
      transition: 0.3s;
      -webkit-tap-highlight-color: transparent;
    }

    .submit-btn:active {
      background: #8d6945;
      transform: scale(0.98);
    }

    #modalOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(2px);
    }

    .modal {
      background: white;
      padding: 40px 20px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      border-radius: 10px;
      border-top: 8px solid var(--primary-brown);
      box-sizing: border-box;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    }

    #modalOverlay.active {
      display: flex;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal h3 {
      margin: 0;
      color: #999;
      font-size: 12px;
      text-transform: uppercase;
    }

    .modal .hs-code {
      font-size: 28px;
      font-weight: 900;
      color: var(--dark-grey);
      margin: 20px 0 30px;
      display: block;
      letter-spacing: -0.5px;
    }

    .modal .message {
      font-size: 13px;
      line-height: 1.5;
      color: var(--dark-grey);
      margin: -12px 0 24px;
      display: none;
    }

    .close-btn {
      background: var(--dark-grey);
      color: white;
      padding: 14px 0;
      width: 100%;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>TEXTILE HS CODE</h2>
    <span class="sub-title">DUCKSAN HS CODE CLASSIFICATOR</span>

    <label class="section-label">BASIC INFO</label>
    <div class="row">
      <label>직기분류</label>
      <select id="d">
        <option value="WOVEN">WOVEN</option>
        <option value="WARP KNIT">WARP KNIT</option>
        <option value="WEFT KNIT">WEFT KNIT</option>
        <option value="면직물_PLAIN">면직물_PLAIN</option>
        <option value="면직물_TWILL">면직물_TWILL</option>
        <option value="면직물_ETC">면직물_ETC</option>
        <option value="면직물_DENIM">면직물_DENIM</option>
      </select>
    </div>

    <label class="section-label">YARN CONTENTS</label>
    <div class="row"><label>POLY, CDP (무가연사)</label><input type="number" id="e" placeholder="입력" min="0" max="100"
        step="0.01"></div>
    <div class="row"><label>POLY, CDP (가연사)</label><input type="number" id="f" placeholder="입력" min="0" max="100"
        step="0.01"></div>
    <div class="row"><label>NYLON (모든 나일론)</label><input type="number" id="g" placeholder="입력" min="0" max="100"
        step="0.01"></div>
    <div class="row"><label>SPANDEX</label><input type="number" id="h" placeholder="입력" min="0" max="100" step="0.01">
    </div>
    <div class="row"><label>ETC (TPE, TPU, 기타)</label><input type="number" id="i" placeholder="입력" min="0" max="100"
        step="0.01"></div>
    <div class="row"><label>COTTON (면)</label><input type="number" id="j" placeholder="입력" min="0" max="100"
        step="0.01"></div>
    <div class="row"><label>STAPLE (단섬유, 방적사)</label><input type="number" id="k" placeholder="입력" min="0" max="100"
        step="0.01"></div>

    <label class="section-label">PROCESS OPTION</label>
    <div class="row">
      <label>코팅 여부</label>
      <div class="radio-group">
        <label><input type="radio" name="coating" value="유" id="l_yes">
          <div>YES</div>
        </label>
        <label><input type="radio" name="coating" value="무" id="l_no" checked>
          <div>NO</div>
        </label>
      </div>
    </div>
    <div class="row">
      <label>염색 종류</label>
      <select id="m">
        <option>무염</option>
        <option selected>후염</option>
        <option>선염</option>
        <option>날염</option>
      </select>
    </div>

    <button class="submit-btn" onclick="runCalc()">CLASSIFY HS CODE</button>
  </div>

  <div id="modalOverlay" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Classifying Result</h3>
      <span class="hs-code" id="hs-display">-</span>
      <span class="message" id="result-message"></span>
      <button class="close-btn" onclick="closeModal()">CLOSE</button>
    </div>
  </div>

  <script>
    function readNumber(id) {
      const rawValue = document.getElementById(id).value.trim();
      return rawValue === "" ? 0 : Number(rawValue);
    }

    function showResult(code, message = "") {
      const messageEl = document.getElementById('result-message');
      document.getElementById('hs-display').innerText = code;
      messageEl.innerText = message;
      messageEl.style.display = message ? 'block' : 'none';
      document.getElementById('modalOverlay').classList.add('active');
    }

    function runCalc() {
      const D8 = document.getElementById('d').value;
      const E8 = readNumber('e');
      const F8 = readNumber('f');
      const G8 = readNumber('g');
      const H8 = readNumber('h');
      const I8 = readNumber('i');
      const J8 = readNumber('j');
      const K8 = readNumber('k');
      const L8 = document.querySelector('input[name="coating"]:checked').value;
      const M8 = document.getElementById('m').value;

      const yarnValues = [E8, F8, G8, H8, I8, J8, K8];
      if (yarnValues.some((value) => Number.isNaN(value) || value < 0 || value > 100)) {
        showResult("입력 오류", "원사 비율은 0부터 100 사이의 숫자로 입력해주세요.");
        return;
      }

      const yarnTotal = yarnValues.reduce((sum, value) => sum + value, 0);
      if (Math.abs(yarnTotal - 100) > 0.01) {
        showResult("합계 오류", `원사 비율 합계가 100%가 아닙니다. 현재 합계: ${yarnTotal.toFixed(2)}%`);
        return;
      }

      const 염색종류 = ["무염", "후염", "선염", "날염"];
      const WARP코드 = ["6005-36-0000", "6005-37-0000", "6005-38-0000", "6005-39-0000"];
      const WEFT코드 = ["6006-31-0000", "6006-32-0000", "6006-33-0000", "6006-34-0000"];
      const E코드 = ["5407-61-1000", "5407-61-2000", "5407-61-3000", "5407-61-4000"];
      const F코드 = ["5407-51-0000", "5407-52-0000", "5407-53-0000", "5407-54-0000"];
      const G코드 = ["5407-41-0000", "5407-42-0000", "5407-43-0000", "5407-44-0000"];
      const 약혼합코드 = ["5407-71-0000", "5407-72-0000", "5407-73-0000", "5407-74-0000"];
      const 혼합EF코드 = ["5407-69-1000", "5407-69-2000", "5407-69-3000", "5407-69-4000"];
      const 혼합GJ코드 = ["5407-81-1000", "5407-82-1000", "5407-83-1000", "5407-84-1000"];
      const 혼합EFJ코드 = ["5407-81-2000", "5407-82-2000", "5407-83-2000", "5407-84-2000"];
      const 혼합IJ코드 = ["5407-81-9000", "5407-82-9000", "5407-83-9000", "5407-84-9000"];
      const 혼합GJK코드 = ["5407-91-1000", "5407-92-1000", "5407-93-1000", "5407-94-1000"];
      const 혼합EFJK코드 = ["5407-91-2000", "5407-92-2000", "5407-93-2000", "5407-94-2000"];
      const 혼합IJK코드 = ["5407-91-9000", "5407-92-9000", "5407-93-9000", "5407-94-9000"];
      const 평직면코드 = ["5209-11-0000", "5209-31-0000", "5209-41-0000", "5209-51-0000"];
      const 능직면코드 = ["5209-12-0000", "5209-32-0000", "5209-43-0000", "5209-52-0000"];
      const 기타면코드 = ["5209-19-0000", "5209-39-0000", "5209-49-0000", "5209-59-0000"];
      const 평직면코드2 = ["5211-11-0000", "5211-31-0000", "5211-41-0000", "5211-51-0000"];
      const 능직면코드2 = ["5211-12-0000", "5211-32-0000", "5211-43-0000", "5211-52-0000"];
      const 기타면코드2 = ["5211-19-0000", "5211-39-0000", "5211-49-0000", "5211-59-0000"];
      const 단섬유코드 = ["5512-11-0000", "5512-19-1000", "5512-19-2000", "5512-19-3000"];
      const 단섬유혼합코드 = ["5515-12-1000", "5515-12-9000", "5515-12-9000", "5515-12-9000"];

      const 염색인덱스 = 염색종류.indexOf(M8);
      let 결과코드 = "";

      if (염색인덱스 === -1) {
        결과코드 = "염색 오류";
      } else if (L8.includes("유")) {
        결과코드 = "5903-20-0000";
      } else if (H8 >= 5 && (D8 === "WEFT KNIT" || D8 === "WARP KNIT")) {
        결과코드 = "6004-10-0000";
      } else if (H8 < 5 && (E8 > 0 || F8 > 0 || G8 > 0 || I8 > 0 || J8 > 0 || K8 > 0) && D8 === "WARP KNIT") {
        결과코드 = WARP코드[염색인덱스];
      } else if (H8 < 5 && (E8 > 0 || F8 > 0 || G8 > 0 || I8 > 0 || J8 > 0 || K8 > 0) && D8 === "WEFT KNIT") {
        결과코드 = WEFT코드[염색인덱스];
      } else if (D8 === "WOVEN" && K8 >= 85) {
        결과코드 = 단섬유코드[염색인덱스];
      } else if (D8 === "WOVEN" && K8 >= 50 && K8 < 85) {
        결과코드 = 단섬유혼합코드[염색인덱스];
      } else if (G8 >= 50 && G8 < 85 && J8 > 0 && D8 === "WOVEN") {
        결과코드 = 혼합GJ코드[염색인덱스];
      } else if (E8 + F8 >= 50 && E8 + F8 < 85 && J8 > 0 && D8 === "WOVEN") {
        결과코드 = 혼합EFJ코드[염색인덱스];
      } else if (E8 + F8 + G8 + I8 >= 50 && J8 > 0 && J8 < 50 && D8 === "WOVEN") {
        결과코드 = 혼합IJ코드[염색인덱스];
      } else if (D8 === "WOVEN" && E8 < 85 && F8 < 85 && E8 + F8 >= 50) {
        결과코드 = 혼합EF코드[염색인덱스];
      } else if (D8 === "WOVEN" && (E8 >= 85 || F8 >= 85 || G8 >= 85)) {
        결과코드 = E8 >= 85 ? E코드[염색인덱스] : (F8 >= 85 ? F코드[염색인덱스] : G코드[염색인덱스]);
      } else if (D8 === "WOVEN" && I8 >= 85) {
        결과코드 = 약혼합코드[염색인덱스];
      } else if (D8 === "WOVEN" && E8 + F8 + G8 > I8 && E8 + F8 < G8 && G8 < 85) {
        결과코드 = 혼합GJK코드[염색인덱스];
      } else if (D8 === "WOVEN" && E8 + F8 + G8 > I8 && G8 < E8 + F8 && E8 + F8 < 85) {
        결과코드 = 혼합EFJK코드[염색인덱스];
      } else if (D8 === "WOVEN" && E8 + F8 + G8 < I8 && I8 < 85) {
        결과코드 = 혼합IJK코드[염색인덱스];
      } else if (D8 === "면직물_PLAIN" && J8 >= 85) {
        결과코드 = 평직면코드[염색인덱스];
      } else if (D8 === "면직물_TWILL" && J8 >= 85) {
        결과코드 = 능직면코드[염색인덱스];
      } else if (D8 === "면직물_ETC" && J8 >= 85) {
        결과코드 = 기타면코드[염색인덱스];
      } else if (D8 === "면직물_DENIM" && J8 >= 85) {
        결과코드 = "5209-42-0000";
      } else if (D8 === "면직물_PLAIN" && J8 >= 50 && J8 < 85) {
        결과코드 = 평직면코드2[염색인덱스];
      } else if (D8 === "면직물_TWILL" && J8 >= 50 && J8 < 85) {
        결과코드 = 능직면코드2[염색인덱스];
      } else if (D8 === "면직물_ETC" && J8 >= 50 && J8 < 85) {
        결과코드 = 기타면코드2[염색인덱스];
      } else if (D8 === "면직물_DENIM" && J8 >= 50 && J8 < 85) {
        결과코드 = "5211-42-0000";
      } else {
        결과코드 = "해당 조건 없음";
      }

      showResult(결과코드);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }
  </script>
</body>

</html>
